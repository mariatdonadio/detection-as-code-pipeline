name: Detection Validation

on:
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup RunReveal CLI
      run: |
        curl -L https://github.com/runreveal/homebrew-runreveal/releases/latest/download/runreveal-linux-amd64.tar.gz > runreveal-linux-amd64.tar.gz
        tar -xvf runreveal-linux-amd64.tar.gz
        chmod +x runreveal
        rm runreveal-linux-amd64.tar.gz
        
    - name: Lint Detections
      env:
        RUNREVEAL_TOKEN: ${{ secrets.RUNREVEAL_API_KEY }}
      run: |
        ./runreveal lint sigma detections/sigma
        ./runreveal lint sql detections/sql
        
    - name: Test Detections
      env:
        RUNREVEAL_TOKEN: ${{ secrets.RUNREVEAL_API_KEY }}
      run: |
        failed_tests=0
        
        # Iterar sobre el archivo JSON directamente con jq
        while read -r row; do
          detection_file=$(echo "$row" | jq -r '.detection_file')
          input_file=$(echo "$row" | jq -r '.input_file')
          expected_exit_code=$(echo "$row" | jq -r '.expected_exit_code')
          
          echo "========================================"
          echo "Testing: $detection_file"
          echo "Input: $input_file"
          
          set +e
          ./runreveal detections run -f "$detection_file" -i "$input_file"
          exit_code=$?
          set -e
          
          if [ "$exit_code" -eq "$expected_exit_code" ]; then
            echo "SUCCESS: test passed (exit code: $exit_code)"
          else
            echo "FAILURE: expected exit code $expected_exit_code but got $exit_code"
            failed_tests=1
          fi
        done < <(jq -c '.[]' .github/detection-tests.json)
        
        if [ "$failed_tests" -ne 0 ]; then
          echo "ERROR: One or more detection tests failed."
          exit 1
        fi
        
    - name: Dry Run Sync
      env:
        RUNREVEAL_TOKEN: ${{ secrets.RUNREVEAL_API_KEY }}
      run: |
        ./runreveal detections sync --dry-run -d detections/sigma
        ./runreveal detections sync --dry-run -d detections/sql