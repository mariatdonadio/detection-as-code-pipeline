name: Detection Validation

on:
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup RunReveal CLI
      run: |
        curl -L https://github.com/runreveal/homebrew-runreveal/releases/latest/download/runreveal-linux-amd64.tar.gz > runreveal-linux-amd64.tar.gz
        tar -xvf runreveal-linux-amd64.tar.gz
        chmod +x runreveal
        rm runreveal-linux-amd64.tar.gz
        
    - name: Lint Detections
      env:
        RUNREVEAL_TOKEN: ${{ secrets.RUNREVEAL_API_KEY }}
      run: |
        ./runreveal lint sigma detections/sigma
        ./runreveal lint sql detections/sql
        
    - name: Load Test Configuration
      id: load-config
      run: |
        # Corrección: Uso de EOF para manejar el JSON multilínea en bash sin que se corte.
        {
          echo 'matrix<<EOF'
          cat .github/detection-tests.json
          echo EOF
        } >> "$GITHUB_OUTPUT"

    - name: Test Detections
      strategy:
        matrix:
          include: ${{ fromJson(steps.load-config.outputs.matrix) }}
      run: |
        # Corrección: set +e evita que un exit code de 1 mate el contenedor inmediatamente.
        set +e
        ./runreveal detections run -f ${{ matrix.detection_file }} -i ${{ matrix.input_file }}
        exit_code=$?
        set -e
        
        expected_exit_code=${{ matrix.expected_exit_code }}
        
        if [ "$exit_code" -eq "$expected_exit_code" ]; then
          echo "SUCCESS: ${{ matrix.detection_file }} test passed (exit code: $exit_code)"
        else
          echo "FAILURE: ${{ matrix.detection_file }} expected exit code $expected_exit_code but got $exit_code"
          exit 1
        fi
        
    - name: Dry Run Sync
      run: |
        ./runreveal detections sync --dry-run -d detections/sigma
        ./runreveal detections sync --dry-run -d detections/sql